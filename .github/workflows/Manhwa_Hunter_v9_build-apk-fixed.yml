name: Build Manhwa Hunter v9 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_PATH=""

          # First look for an already-extracted project anywhere in the repository.
          while IFS= read -r file; do
            candidate="$(dirname "$file")"
            if [ -f "$candidate/app/build.gradle.kts" ]; then
              PROJECT_PATH="$candidate"
              break
            fi
          done < <(find . -type f -name settings.gradle.kts -not -path './.git/*' -print)

          # If the project is supplied as a ZIP, extract it and locate the Gradle root.
          if [ -z "$PROJECT_PATH" ]; then
            ZIP_PATH=""
            while IFS= read -r file; do
              ZIP_PATH="$file"
              break
            done < <(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print)

            if [ -n "$ZIP_PATH" ]; then
              echo "No extracted project found. Extracting: $ZIP_PATH"
              mkdir -p "$RUNNER_TEMP/manhwa-project"
              unzip -oq "$ZIP_PATH" -d "$RUNNER_TEMP/manhwa-project"
              while IFS= read -r file; do
                candidate="$(dirname "$file")"
                if [ -f "$candidate/app/build.gradle.kts" ]; then
                  PROJECT_PATH="$candidate"
                  break
                fi
              done < <(find "$RUNNER_TEMP/manhwa-project" -type f -name settings.gradle.kts -print)
            fi
          fi

          if [ -z "$PROJECT_PATH" ]; then
            echo '::error::Android project not found. Add the extracted mhv5 project folder OR commit Manhwa_Hunter_v9_Neon_Redesign.zip to the repository root.'
            echo 'Files visible in repository:'
            find . -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          PROJECT_PATH="$(cd "$PROJECT_PATH" && pwd)"
          echo "project_dir=$PROJECT_PATH" >> "$GITHUB_OUTPUT"
          echo "Using Android project at: $PROJECT_PATH"
          test -f "$PROJECT_PATH/settings.gradle.kts"
          test -f "$PROJECT_PATH/app/build.gradle.kts"

      - name: Build debug APK
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace clean assembleDebug
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Gradle finished but APK was not found at $APK"
            find "$PROJECT_DIR/app/build/outputs" -maxdepth 5 -type f -print 2>/dev/null || true
            exit 1
          fi
          echo "APK built successfully: $APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-v9-debug-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
