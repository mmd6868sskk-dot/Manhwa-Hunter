name: Build Manhwa Hunter APK
'on':
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract v4 project ZIP
        run: |
          unzip -o Manhwa_Hunter_v4_PurpleRed.zip -d /tmp/manhwa-project
          cp -a /tmp/manhwa-project/. .

      - name: Build debug APK
        run: gradle -p mhv4 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-APK
          path: mhv4/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
