name: Build Manhwa Hunter v6 APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract v6 project ZIP
        run: |
          unzip -o Manhwa_Hunter_v6_Reference_UI.zip -d .
          test -f mhv5/settings.gradle.kts
          test -f mhv5/app/build.gradle.kts

      - name: Build debug APK
        run: gradle -p mhv5 assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-v6-APK
          path: mhv5/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
