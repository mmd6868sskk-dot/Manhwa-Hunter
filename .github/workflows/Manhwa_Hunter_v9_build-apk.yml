name: Build Manhwa Hunter v8 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Locate Android project
        shell: bash
        run: |
          if [ -f settings.gradle.kts ] && [ -f app/build.gradle.kts ]; then
            echo "PROJECT_DIR=$PWD" >> "$GITHUB_ENV"
          elif [ -f mhv5/settings.gradle.kts ] && [ -f mhv5/app/build.gradle.kts ]; then
            echo "PROJECT_DIR=$PWD/mhv5" >> "$GITHUB_ENV"
          else
            echo "Could not locate settings.gradle.kts and app/build.gradle.kts"
            find . -maxdepth 4 -name settings.gradle.kts -print
            exit 1
          fi
      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-v8-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
