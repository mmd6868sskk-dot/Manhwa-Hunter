name: Build Manhwa Hunter APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip -q Manhwa_Hunter_Android_Project.zip -d /tmp/manhwa-project
          cp -a /tmp/manhwa-project/. .

      - name: Build APK
        run: |
          gradle --version || true
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
