name: Build Manhwa Hunter v7 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Find or extract Android project
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "mhv5" ] && [ -f "mhv5/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=mhv5" >> "$GITHUB_ENV"
          else
            ZIP_FILE=""
            for candidate in Manhwa_Hunter_v7_Reference_Style.zip Manhwa_Hunter_v6_Reference_UI.zip Manhwa_Hunter_v7.zip; do
              if [ -f "$candidate" ]; then ZIP_FILE="$candidate"; break; fi
            done
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -print -quit || true)"
            fi
            if [ -z "$ZIP_FILE" ]; then
              echo "ERROR: No mhv5 project folder or project ZIP was found in the repository root. Upload the project ZIP to the repository root, or upload the extracted mhv5 folder." >&2
              exit 1
            fi
            echo "Extracting $ZIP_FILE"
            mkdir -p extracted-project
            unzip -oq "$ZIP_FILE" -d extracted-project
            PROJECT_PATH="$(find extracted-project -type f -name settings.gradle.kts -print -quit | xargs -r dirname)"
            if [ -z "$PROJECT_PATH" ] || [ ! -f "$PROJECT_PATH/app/build.gradle.kts" ]; then
              echo "ERROR: Could not find an Android Gradle project (settings.gradle.kts and app/build.gradle.kts) inside $ZIP_FILE." >&2
              exit 1
            fi
            echo "PROJECT_DIR=$PROJECT_PATH" >> "$GITHUB_ENV"
          fi

      - name: Build debug APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-v7-debug-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
