name: Build Manhwa Hunter v7 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract and locate project
        shell: bash
        run: |
          set -euo pipefail

          if [ -f "mhv5/settings.gradle.kts" ]; then
            PROJECT_DIR="mhv5"
          else
            ZIP_FILE="Manhwa_Hunter_v7_Reference_Style.zip"

            if [ ! -f "$ZIP_FILE" ]; then
              echo "Project ZIP not found: $ZIP_FILE"
              echo "Upload the project ZIP to the repository root."
              exit 1
            fi

            mkdir -p extracted
            unzip -oq "$ZIP_FILE" -d extracted

            PROJECT_DIR="$(find extracted -type f \
              -name settings.gradle.kts \
              -print -quit | xargs -r dirname)"

            if [ -z "$PROJECT_DIR" ]; then
              echo "Android project not found inside ZIP."
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Build APK
        run: gradle -p "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Manhwa-Hunter-v7-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
